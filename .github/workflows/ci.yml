name: CI
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Runic formatting check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1.7.0
      - uses: julia-actions/julia-runtest@v1.13.0
      - uses: julia-actions/julia-processcoverage@v1.2.2
        continue-on-error: true
      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
